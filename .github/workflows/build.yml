name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cp bin/Release/sem-release sem-release-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: sem-release-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cp bin/Release/sem-release.exe sem-release-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sem-release-windows.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: v1.0.0
          files: |
            artifacts/linux/sem-release-linux
            artifacts/windows/sem-release-windows.exe
          overwrite_files: true
          make_latest: true
